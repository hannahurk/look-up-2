<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Look Up</title>
  </head>
  <body>

<div class="oculus is-loading" id="oculus">
  <img class="oculus-image" id="oculus-image" alt="">
  <video class="oculus-video" id="oculus-video" muted loop playsinline autoplay></video>
  <iframe class="oculus-video-frame" id="oculus-video-frame" allow="autoplay; encrypted-media" frameborder="0"></iframe>
  <div class="oculus-fallback" id="oculus-fallback"><span>&#9737;</span></div>
</div>

<div class="wx-block" id="wx-panel">
  <span class="wx-label" id="wx-label">Cosmic Meteorology</span>
  <div class="wx-readout" id="wx-readout">
    <span class="wx-value" id="wind-speed">&mdash;</span><span class="wx-unit" id="wind-unit">mph solar wind</span><span class="aurora-badge" id="aurora-badge" hidden>&#9733; Aurora Watch</span>
  </div>
  <div class="wx-readout secondary">
    <span class="wx-value" id="wind-bz">&mdash;</span><span class="wx-unit" id="bz-unit">nT Bz</span>
  </div>
  <p class="wx-alert" id="wx-alert">Checking conditions&hellip;</p>
</div>

    <script src="./script.js"></script>
  </body>
</html>
